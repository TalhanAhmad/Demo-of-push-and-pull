<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black & Yellow Website</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <div class="logo">MyWebsite</div>

        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#">About</a>
            <a href="#">Pages</a>
        </div>

        <a href="#signup" class="signup-btn" id="sign up">Sign Up</a>
    </nav>

    <!-- TODO LIST SECTION -->
    <section>
        <h2  id="main">My To-Do List</h2>

        <div class="todo-container">

            <!-- Input Area -->
            <div class="todo-input talha">
                <input type="text" placeholder="Enter a new task">
                <button>Add Task</button>
            </div>

            <!-- Task List -->
            <ul class="todo-list">  
                <!-- <li class="navitem"></li>  
                <li class="navitem"></li>  
                <li class="navitem"></li>     -->
            </ul>
            <!-- delete button -->
         <button class="delete-btn">Delete</button>
        </div>
    </section>

    <!-- SIGN UP SECTION -->
    <section id="signup">
        <h2>Sign Up</h2>

        <div class="signup-container">
            <form>
                <input type="email" placeholder="Enter your email">
                <input type="password" placeholder="Enter your password">
                <input type="password" placeholder="Confirm your password">
                <textarea rows="4" placeholder="Tell us about yourself"></textarea>
                <button id="create" type="submit">Create Account</button>
            </form>
        </div>
    </section>
<div class="my-buttons"> 
    <button  id="one">fisrt one</button>
    <button  id="two">second one</button>
    <button  id="three">third one</button>
    </div>
<script src="16.js"></script>
</body>
</html>
